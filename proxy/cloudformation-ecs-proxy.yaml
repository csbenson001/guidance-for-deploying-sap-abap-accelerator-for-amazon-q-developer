AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SAP RFC TCP Proxy on ECS Fargate
  Enables local Docker containers to connect to SAP systems through AWS
  when VPN restrictions block direct connections.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the proxy will be deployed (must have access to SAP)

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the ECS tasks (should have access to SAP system)

  SAPTargetHost:
    Type: String
    Description: SAP system hostname or IP address
    AllowedPattern: ^[a-zA-Z0-9.-]+$

  SAPTargetPort:
    Type: Number
    Default: 3300
    Description: SAP RFC port (3300 for system 00, 3301 for 01, etc.)
    MinValue: 1
    MaxValue: 65535

  AllowedCIDR:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to connect to the proxy (restrict for security)
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  ContainerCpu:
    Type: Number
    Default: 256
    Description: CPU units for the container (256 = 0.25 vCPU)
    AllowedValues: [256, 512, 1024, 2048, 4096]

  ContainerMemory:
    Type: Number
    Default: 512
    Description: Memory in MB for the container
    AllowedValues: [512, 1024, 2048, 4096, 8192]

Resources:
  # ECR Repository for the proxy image
  ProxyECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: sap-rfc-proxy
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  # ECS Cluster
  ProxyCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: sap-rfc-proxy-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # CloudWatch Log Group
  ProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/sap-rfc-proxy
      RetentionInDays: 30

  # IAM Role for ECS Task Execution
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sap-rfc-proxy-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Security Group for the Proxy
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: sap-rfc-proxy-sg
      GroupDescription: Security group for SAP RFC proxy
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref SAPTargetPort
          ToPort: !Ref SAPTargetPort
          CidrIp: !Ref AllowedCIDR
          Description: Allow RFC traffic from allowed CIDR
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref SAPTargetPort
          ToPort: !Ref SAPTargetPort
          CidrIp: 0.0.0.0/0
          Description: Allow outbound RFC to SAP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS for ECR pull

  # ECS Task Definition
  ProxyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: sap-rfc-proxy
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: sap-rfc-proxy
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sap-rfc-proxy:latest
          Essential: true
          PortMappings:
            - ContainerPort: !Ref SAPTargetPort
              Protocol: tcp
          Environment:
            - Name: SAP_TARGET_HOST
              Value: !Ref SAPTargetHost
            - Name: SAP_TARGET_PORT
              Value: !Ref SAPTargetPort
            - Name: LISTEN_PORT
              Value: !Ref SAPTargetPort
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ProxyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: proxy
          HealthCheck:
            Command:
              - CMD-SHELL
              - pgrep socat || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10

  # Network Load Balancer for stable endpoint
  ProxyNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: sap-rfc-proxy-nlb
      Scheme: internet-facing
      Type: network
      Subnets: !Ref SubnetIds

  # NLB Target Group
  ProxyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: sap-rfc-proxy-tg
      Port: !Ref SAPTargetPort
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: TCP
      HealthCheckPort: traffic-port
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  # NLB Listener
  ProxyNLBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ProxyNLB
      Port: !Ref SAPTargetPort
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProxyTargetGroup

  # ECS Service
  ProxyService:
    Type: AWS::ECS::Service
    DependsOn: ProxyNLBListener
    Properties:
      ServiceName: sap-rfc-proxy-service
      Cluster: !Ref ProxyCluster
      TaskDefinition: !Ref ProxyTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ProxySecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: sap-rfc-proxy
          ContainerPort: !Ref SAPTargetPort
          TargetGroupArn: !Ref ProxyTargetGroup

Outputs:
  ProxyEndpoint:
    Description: NLB DNS name - use this as SAP_HOST in your local Docker config
    Value: !GetAtt ProxyNLB.DNSName

  ProxyPort:
    Description: Port to connect to
    Value: !Ref SAPTargetPort

  ECRRepository:
    Description: ECR repository URI for pushing the proxy image
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sap-rfc-proxy

  LocalDockerCommand:
    Description: Example Docker command using the proxy
    Value: !Sub |
      docker run --rm -i --platform linux/amd64 \
        --mount type=bind,source=/path/to/secrets,target=/run/secrets,readonly \
        -e SAP_HOST=${ProxyNLB.DNSName} \
        -e SAP_CLIENT=100 \
        -e SAP_USERNAME=your_username \
        abap-accelerator-q-3.2.1-node22 \
        node dist/index.js
